name: run check-for-feasts.py

on:
  schedule:
    - cron: '0 20 * * 0' # At 20:00 on Sunday
  workflow_dispatch:  # Adds manual trigger button

jobs:
  quarto-render-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: checkout repo content
      uses: actions/checkout@v3
    - name: Update apt-get
      run: sudo apt-get update
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # caching pip dependencies
    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
    - name: Run check-for-feasts.py
      env:
        GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        TARGET_REPO: musicministry/song-urls
        OWNER: musicministry
      run: python check-for-feasts.py --year 2026
    - name: Commit file
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff-index --quiet HEAD || (git commit -a -m "Auto release upcoming feast" --allow-empty)
    - name: push changes
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: quarto
    - name: Publish to GitHub Pages (and render)
      uses: quarto-dev/quarto-actions/publish@v2
      with:
        target: gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions

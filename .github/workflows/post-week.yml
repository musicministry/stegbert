name: run post-week.py
on:
  schedule:
    - cron: '0 20 * * 0' # At 20:00 on Sunday
  workflow_dispatch:  # Adds manual trigger button

jobs:
  quarto-render-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit CSV and HTML back to repo
      secrets: write        # needed to update the token secret    
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Checkout repo content
      uses: actions/checkout@v3

    - name: Update apt-get
      run: sudo apt-get update

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # caching pip dependencies

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        # To install LaTeX to build PDF book 
        tinytex: true 
        # uncomment below and fill to pin a version
        # version: 0.9.600

    - name: Run post-week.py
      env:
        GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        TARGET_REPO: musicministry/song-urls
        OWNER: musicministry
      run: |
          year=$(date +%Y)
          python scripts/post-week.py $year

    - name: Write credentials files
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      run: |
        echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
        echo "$GOOGLE_TOKEN_JSON" > token.json

    - name: Run cantors.py
      id: cantor           # needed to reference outputs below
      env:
        GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      run: |
          year=$(date +%Y)
          month=$(date +%m)
          python scripts/cantors.py --start $year-$month-01 --end $year-12-31

    - name: Update token secret if refreshed
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OLD_TOKEN: ${{ secrets.GOOGLE_TOKEN_JSON }}
        NEW_TOKEN: ${{ steps.cantor.outputs.token_json }}
      run: |
        if [ "$NEW_TOKEN" != "$OLD_TOKEN" ]; then
          echo "Token was refreshed — updating secret."
          gh secret set GOOGLE_TOKEN_JSON --body "$NEW_TOKEN"
        else
          echo "Token unchanged — no update needed."
        fi

    - name: Commit automated updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add posts/*.qmd
        git diff --staged --quiet || git commit -m "Auto release upcoming feast [skip ci]"
        git add calendars/cantors.csv schedule_lookup.html
        git diff --staged --quiet || git commit -m "Update cantor schedule [skip ci]"
        git push origin quarto

    - name: Publish to GitHub Pages (and render)
      uses: quarto-dev/quarto-actions/publish@v2
      with:
        target: gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions

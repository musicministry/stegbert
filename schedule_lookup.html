<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; padding: 1em; }
  .controls { display: flex; align-items: center; gap: 1em; flex-wrap: wrap; margin-bottom: 1.2em; }
  label { font-weight: bold; }
  select { padding: 0.4em; font-size: 1em; }
  #result { margin-top: 1em; padding: 0.8em; background: #f5f5f5;
             border-left: 4px solid #b32121; min-height: 2em; }
  #result ul { margin: 0.3em 0 0 1em; padding: 0; }
  #value-select-container { display: none; }
</style>
</head>
<body>

Use this widget to quickly find the Masses you are scheduled for. Search by name or Mass time. Updates automatically every Sunday afternoon using the current version of the cantor calendar. <br><br><br>

<div class="controls">
  <label for="filter-by">Filter by:</label>
  <select id="filter-by">
    <option value="">-- Select --</option>
    <option value="name">Name</option>
    <option value="time">Mass Time</option>
  </select>

  <div id="value-select-container">
    <select id="value-select">
      <option value="">-- Select --</option>
    </select>
  </div>
</div>

<div id="result"></div>

<script>

  const timeToSlots = {"11:00 AM": [{"date": "Sun 9/6", "name": "Luisa"}, {"date": "Sun 9/13", "name": "Maggie"}, {"date": "Sun 9/20", "name": "MATT OUT OF TOWN"}, {"date": "Sun 9/27", "name": "Allison"}, {"date": "Sun 10/4", "name": "Luisa"}, {"date": "Sun 10/11", "name": "Maggie"}, {"date": "Sun 10/18", "name": "Luisa"}, {"date": "Sun 10/25", "name": "Allison"}, {"date": "Sun 11/1", "name": "Luisa"}, {"date": "Sun 11/8", "name": "Maggie"}, {"date": "Sun 11/15", "name": "Luisa"}, {"date": "Sun 11/22", "name": "Allison"}, {"date": "Sun 11/29", "name": "Maggie"}, {"date": "Sun 12/6", "name": "Luisa"}, {"date": "Sun 12/13", "name": "Maggie"}, {"date": "Sun 12/20", "name": "Allison"}], "5:00 PM": [{"date": "Sat 9/5", "name": "Lynn"}, {"date": "Sat 9/12", "name": "Bridget"}, {"date": "Sat 9/19", "name": "Lynn"}, {"date": "Sat 9/26", "name": "Lynn"}, {"date": "Sat 10/3", "name": "Lynn"}, {"date": "Sat 10/10", "name": "Lynn"}, {"date": "Sat 10/17", "name": "Lynn"}, {"date": "Sat 10/24", "name": "Lynn"}, {"date": "Sat 10/31", "name": "Lynn"}, {"date": "Sat 11/7", "name": "Lynn"}, {"date": "Sat 11/14", "name": "Lynn"}, {"date": "Sat 11/21", "name": "Lynn"}, {"date": "Sat 11/28", "name": "Lynn"}, {"date": "Sat 12/5", "name": "Lynn"}, {"date": "Sat 12/12", "name": "Lynn"}, {"date": "Sat 12/19", "name": "Lynn"}, {"date": "Sat 12/26", "name": "Lynn"}], "8:00 AM": [{"date": "Sun 9/6", "name": "Chris"}, {"date": "Sun 9/13", "name": "Chris"}, {"date": "Sun 9/20", "name": "MATT OUT OF TOWN"}, {"date": "Sun 9/27", "name": "Chris"}, {"date": "Sun 10/4", "name": "Chris"}, {"date": "Sun 10/11", "name": "Chris"}, {"date": "Sun 10/18", "name": "Chris"}, {"date": "Sun 10/25", "name": "Chris"}, {"date": "Sun 11/1", "name": "Chris"}, {"date": "Sun 11/8", "name": "Chris"}, {"date": "Sun 11/15", "name": "Chris"}, {"date": "Sun 11/22", "name": "Chris"}, {"date": "Sun 11/29", "name": "Chris"}, {"date": "Sun 12/6", "name": "Chris"}, {"date": "Sun 12/13", "name": "Chris"}, {"date": "Sun 12/20", "name": "Chris"}, {"date": "Sun 12/27", "name": "Chris"}]};
  const nameOptions = `<option value="">-- Select a name --</option>
    <option value="Allison">Allison</option>
<option value="Bridget">Bridget</option>
<option value="Chris">Chris</option>
<option value="Luisa">Luisa</option>
<option value="Lynn">Lynn</option>
<option value="MATT OUT OF TOWN">MATT OUT OF TOWN</option>
<option value="Maggie">Maggie</option>`;
  const timeOptions = `<option value="">-- Select a time --</option>
    <option value="11:00 AM">11:00 AM</option>
<option value="5:00 PM">5:00 PM</option>
<option value="8:00 AM">8:00 AM</option>`;

  const filterBy     = document.getElementById("filter-by");
  const valueContainer = document.getElementById("value-select-container");
  const valueSelect  = document.getElementById("value-select");
  const result       = document.getElementById("result");

  filterBy.addEventListener("change", function() {
    result.innerHTML = "";
    if (!this.value) {
      valueContainer.style.display = "none";
      valueSelect.innerHTML = "";
      return;
    }
    valueSelect.innerHTML = this.value === "name" ? nameOptions : timeOptions;
    valueContainer.style.display = "inline-block";
  });

  valueSelect.addEventListener("change", function() {
    const mode = filterBy.value;
    const val  = this.value;
    if (!val) { result.innerHTML = ""; return; }

    if (mode === "name") {
      const slots = nameToSlots[val] || [];
      result.innerHTML = `<strong>${val}</strong> is scheduled for:
        <ul>${slots.map(s => `<li>${s.date} &ndash; ${s.time}</li>`).join("")}</ul>`;
    } else {
      const slots = timeToSlots[val] || [];
      result.innerHTML = `Scheduled at <strong>${val}</strong>:
        <ul>${slots.map(s => `<li>${s.date} &ndash; ${s.name}</li>`).join("")}</ul>`;
    }
  });
</script>
</body>
</html>

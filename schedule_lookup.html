<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; padding: 1em; }
  .controls { display: flex; align-items: center; gap: 1em; flex-wrap: wrap; margin-bottom: 1.2em; }
  label { font-weight: bold; }
  select { padding: 0.4em; font-size: 1em; }
  #result { margin-top: 1em; padding: 0.8em; background: #f5f5f5;
             border-left: 4px solid #b32121; min-height: 2em; }
  #result ul { margin: 0.3em 0 0 1em; padding: 0; }
  #value-select-container { display: none; }
</style>
</head>
<body>

Use this widget to quickly find the Masses you are scheduled for. Search by name or Mass time. Updates automatically every Sunday afternoon using the current version of the cantor calendar. <br><br><br>

<div class="controls">
  <label for="filter-by">Filter by:</label>
  <select id="filter-by">
    <option value="">-- Select --</option>
    <option value="name">Name</option>
    <option value="time">Mass Time</option>
  </select>

  <div id="value-select-container">
    <select id="value-select">
      <option value="">-- Select --</option>
    </select>
  </div>
</div>

<div id="result"></div>

<script>
  const nameToSlots = {"Allison": [{"date": "Sun 8/2", "time": "11:00 AM"}, {"date": "Sun 8/23", "time": "11:00 AM"}, {"date": "Sun 9/20", "time": "11:00 AM"}], "Chris": [{"date": "Sun 8/2", "time": "8:00 AM"}, {"date": "Sun 8/9", "time": "8:00 AM"}, {"date": "Sun 8/16", "time": "8:00 AM"}, {"date": "Sun 8/23", "time": "8:00 AM"}, {"date": "Sun 8/30", "time": "8:00 AM"}, {"date": "Sun 9/6", "time": "8:00 AM"}, {"date": "Sun 9/13", "time": "8:00 AM"}, {"date": "Sun 9/20", "time": "8:00 AM"}, {"date": "Sun 9/27", "time": "8:00 AM"}], "Luisa": [{"date": "Sun 7/5", "time": "11:00 AM"}, {"date": "Sun 7/19", "time": "11:00 AM"}, {"date": "Sun 8/16", "time": "11:00 AM"}, {"date": "Sun 9/6", "time": "11:00 AM"}, {"date": "Sun 9/27", "time": "11:00 AM"}], "Lynn": [{"date": "Sat 7/4", "time": "5:00 PM"}, {"date": "Sat 7/11", "time": "5:00 PM"}, {"date": "Sat 7/18", "time": "5:00 PM"}, {"date": "Sat 7/25", "time": "5:00 PM"}, {"date": "Sat 8/1", "time": "5:00 PM"}, {"date": "Sat 8/8", "time": "5:00 PM"}, {"date": "Sat 8/15", "time": "5:00 PM"}, {"date": "Sat 8/22", "time": "5:00 PM"}, {"date": "Sat 8/29", "time": "5:00 PM"}, {"date": "Sat 9/5", "time": "5:00 PM"}, {"date": "Sat 9/12", "time": "5:00 PM"}, {"date": "Sat 9/19", "time": "5:00 PM"}, {"date": "Sat 9/26", "time": "5:00 PM"}, {"date": "Sat 10/3", "time": "5:00 PM"}, {"date": "Sat 10/10", "time": "5:00 PM"}, {"date": "Sat 10/17", "time": "5:00 PM"}, {"date": "Sat 10/24", "time": "5:00 PM"}, {"date": "Sat 10/31", "time": "5:00 PM"}, {"date": "Sat 11/7", "time": "5:00 PM"}, {"date": "Sat 11/14", "time": "5:00 PM"}, {"date": "Sat 11/21", "time": "5:00 PM"}, {"date": "Sat 11/28", "time": "5:00 PM"}, {"date": "Sat 12/5", "time": "5:00 PM"}, {"date": "Sat 12/12", "time": "5:00 PM"}, {"date": "Sat 12/19", "time": "5:00 PM"}, {"date": "Sat 12/26", "time": "5:00 PM"}], "Maggie": [{"date": "Sun 7/12", "time": "11:00 AM"}, {"date": "Sun 7/26", "time": "11:00 AM"}, {"date": "Sun 8/9", "time": "11:00 AM"}, {"date": "Sun 8/30", "time": "11:00 AM"}, {"date": "Sun 9/13", "time": "11:00 AM"}]};
  const timeToSlots = {"11:00 AM": [{"date": "Sun 7/5", "name": "Luisa"}, {"date": "Sun 7/12", "name": "Maggie"}, {"date": "Sun 7/19", "name": "Luisa"}, {"date": "Sun 7/26", "name": "Maggie"}, {"date": "Sun 8/2", "name": "Allison"}, {"date": "Sun 8/9", "name": "Maggie"}, {"date": "Sun 8/16", "name": "Luisa"}, {"date": "Sun 8/23", "name": "Allison"}, {"date": "Sun 8/30", "name": "Maggie"}, {"date": "Sun 9/6", "name": "Luisa"}, {"date": "Sun 9/13", "name": "Maggie"}, {"date": "Sun 9/20", "name": "Allison"}, {"date": "Sun 9/27", "name": "Luisa"}], "5:00 PM": [{"date": "Sat 7/4", "name": "Lynn"}, {"date": "Sat 7/11", "name": "Lynn"}, {"date": "Sat 7/18", "name": "Lynn"}, {"date": "Sat 7/25", "name": "Lynn"}, {"date": "Sat 8/1", "name": "Lynn"}, {"date": "Sat 8/8", "name": "Lynn"}, {"date": "Sat 8/15", "name": "Lynn"}, {"date": "Sat 8/22", "name": "Lynn"}, {"date": "Sat 8/29", "name": "Lynn"}, {"date": "Sat 9/5", "name": "Lynn"}, {"date": "Sat 9/12", "name": "Lynn"}, {"date": "Sat 9/19", "name": "Lynn"}, {"date": "Sat 9/26", "name": "Lynn"}, {"date": "Sat 10/3", "name": "Lynn"}, {"date": "Sat 10/10", "name": "Lynn"}, {"date": "Sat 10/17", "name": "Lynn"}, {"date": "Sat 10/24", "name": "Lynn"}, {"date": "Sat 10/31", "name": "Lynn"}, {"date": "Sat 11/7", "name": "Lynn"}, {"date": "Sat 11/14", "name": "Lynn"}, {"date": "Sat 11/21", "name": "Lynn"}, {"date": "Sat 11/28", "name": "Lynn"}, {"date": "Sat 12/5", "name": "Lynn"}, {"date": "Sat 12/12", "name": "Lynn"}, {"date": "Sat 12/19", "name": "Lynn"}, {"date": "Sat 12/26", "name": "Lynn"}], "8:00 AM": [{"date": "Sun 8/2", "name": "Chris"}, {"date": "Sun 8/9", "name": "Chris"}, {"date": "Sun 8/16", "name": "Chris"}, {"date": "Sun 8/23", "name": "Chris"}, {"date": "Sun 8/30", "name": "Chris"}, {"date": "Sun 9/6", "name": "Chris"}, {"date": "Sun 9/13", "name": "Chris"}, {"date": "Sun 9/20", "name": "Chris"}, {"date": "Sun 9/27", "name": "Chris"}]};
  const nameOptions = `<option value="">-- Select a name --</option>
    <option value="Allison">Allison</option>
<option value="Chris">Chris</option>
<option value="Luisa">Luisa</option>
<option value="Lynn">Lynn</option>
<option value="Maggie">Maggie</option>`;
  const timeOptions = `<option value="">-- Select a time --</option>
    <option value="11:00 AM">11:00 AM</option>
<option value="5:00 PM">5:00 PM</option>
<option value="8:00 AM">8:00 AM</option>`;

  const filterBy     = document.getElementById("filter-by");
  const valueContainer = document.getElementById("value-select-container");
  const valueSelect  = document.getElementById("value-select");
  const result       = document.getElementById("result");

  filterBy.addEventListener("change", function() {
    result.innerHTML = "";
    if (!this.value) {
      valueContainer.style.display = "none";
      valueSelect.innerHTML = "";
      return;
    }
    valueSelect.innerHTML = this.value === "name" ? nameOptions : timeOptions;
    valueContainer.style.display = "inline-block";
  });

  valueSelect.addEventListener("change", function() {
    const mode = filterBy.value;
    const val  = this.value;
    if (!val) { result.innerHTML = ""; return; }

    if (mode === "name") {
      const slots = nameToSlots[val] || [];
      result.innerHTML = `<strong>${val}</strong> is scheduled for:
        <ul>${slots.map(s => `<li>${s.date} &ndash; ${s.time}</li>`).join("")}</ul>`;
    } else {
      const slots = timeToSlots[val] || [];
      result.innerHTML = `Scheduled at <strong>${val}</strong>:
        <ul>${slots.map(s => `<li>${s.date} &ndash; ${s.name}</li>`).join("")}</ul>`;
    }
  });
</script>
</body>
</html>
